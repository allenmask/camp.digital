<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Camp Digital — The Social Team for Brands</title>
  <meta name="description" content="Camp Digital is the social team for brands. A creative studio built to turn social media into a meaningful driver of brand and business growth." />
  <meta property="og:title" content="Camp Digital — The Social Team for Brands" />
  <meta property="og:description" content="A creative studio built to turn social media into a meaningful driver of brand and business growth." />
  <meta property="og:url" content="https://camp.digital" />
  <meta name="twitter:card" content="summary" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="alternate icon" href="assets/favicon.svg" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #090a0d;
      --bg-ambient: radial-gradient(circle at 50% 45%, rgba(135, 142, 126, 0.12) 0%, rgba(9, 10, 13, 0) 70%),
                    radial-gradient(circle at 50% 10%, rgba(208, 151, 61, 0.06) 0%, transparent 60%);
      --text: #f5f6f8;
      --text-muted: #8e95a0;
      --text-dim: #545b66;
      --accent: #d0973d;
      --camp-green: #878e7e;
      --camp-clay: #e6bda8;
      --border-subtle: rgba(255, 255, 255, 0.09);
      --font-display: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'Inconsolata', monospace;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      background-image: var(--bg-ambient);
      background-attachment: fixed;
      color: var(--text);
      font-family: var(--font-display);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* ── TOP UTILITY BAR ── */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: clamp(20px, 4.5vh, 36px) clamp(22px, 5vw, 48px);
      pointer-events: none;
    }

    .top-bar > * {
      pointer-events: auto;
    }

    /* Official Camp Digital CD Pennant Flag (Top Left, from Deck Page 16) */
    .flag-icon-btn {
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      padding: 8px 4px;
      text-decoration: none;
      transition: transform 0.3s var(--ease), color 0.3s ease, opacity 0.3s ease;
      opacity: 0.95;
    }

    .flag-icon-btn:hover {
      transform: scale(1.08);
      color: var(--accent);
      opacity: 1;
    }

    .flag-icon-btn:active {
      transform: scale(0.96);
    }

    .flag-icon-btn svg {
      width: 36px;
      height: 28px;
      display: block;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* Full Site / Simple Site Segmented Toggle in Top Bar */
    .view-toggle {
      display: inline-flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      border-radius: 9999px;
      padding: 3px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .view-toggle-item {
      font-size: 0.74rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--text-muted);
      padding: 5px 12px;
      border-radius: 9999px;
      text-decoration: none;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .view-toggle-item.active {
      background: rgba(255, 255, 255, 0.12);
      color: var(--text);
      font-weight: 600;
    }

    .view-toggle-item:hover:not(.active) {
      color: var(--text);
    }

    /* Minimal Perpetual Mail Icon (Standalone icon, no circle enclosure) */
    .mail-icon-btn {
      background: none;
      border: none;
      box-shadow: none;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.25s var(--ease);
      opacity: 0.9;
    }

    .mail-icon-btn:hover {
      color: var(--accent);
      transform: scale(1.15) translateY(-1px);
      opacity: 1;
    }

    .mail-icon-btn:active {
      transform: scale(0.96);
    }

    .mail-icon-btn svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      stroke-width: 1.65;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ── VIEWPORT STAGE & PAGE SLIDER ── */
    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .slider-track {
      width: 100%;
      max-width: 680px;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Page Panels */
    .page-panel {
      position: absolute;
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transform: translateY(28px) scale(0.98);
      transition: opacity 0.5s var(--ease), transform 0.55s var(--ease);
      padding: 0 16px;
    }

    .page-panel.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }

    .page-panel.exiting-up {
      opacity: 0;
      pointer-events: none;
      transform: translateY(-28px) scale(0.98);
    }

    /* ── PAGE 1: HOME STYLING ── */
    .brand-title {
      font-size: clamp(2.4rem, 7.5vw, 3.9rem);
      font-weight: 600;
      letter-spacing: -0.035em;
      line-height: 1.05;
      color: var(--text);
      margin-bottom: 12px;
      user-select: none;
    }

    .brand-tagline {
      font-size: clamp(0.98rem, 2.6vw, 1.25rem);
      font-weight: 400;
      color: var(--text-muted);
      letter-spacing: -0.015em;
      margin-bottom: clamp(36px, 7vh, 50px);
      user-select: none;
    }

    /* Navigation Links Stack */
    .nav-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(14px, 2.5vh, 20px);
    }

    .action-link {
      background: none;
      border: none;
      color: var(--text);
      font-family: inherit;
      font-size: clamp(1.05rem, 2.7vw, 1.28rem);
      font-weight: 400;
      letter-spacing: -0.01em;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      padding: 6px 14px;
      border-radius: 8px;
      transition: color 0.25s ease, transform 0.25s var(--ease), opacity 0.25s ease;
      opacity: 0.9;
    }

    .action-link .arrow {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 1.15em;
      line-height: 1;
      color: var(--text-muted);
      transition: transform 0.25s var(--ease), color 0.25s ease;
    }

    .action-link:hover {
      color: var(--text);
      opacity: 1;
    }

    .action-link:hover .arrow {
      color: var(--accent);
    }

    .link-portfolio:hover .arrow {
      transform: translateX(4px);
    }

    .link-offerings:hover .arrow {
      transform: translateY(4px);
    }

    /* ── PAGE 2: OFFERINGS STYLING ── */
    .offerings-heading {
      font-size: clamp(1.05rem, 2.8vw, 1.3rem);
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: -0.01em;
      margin-bottom: clamp(24px, 4vh, 34px);
      user-select: none;
    }

    .services-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(10px, 2.2vh, 16px);
      margin-bottom: clamp(32px, 5.5vh, 46px);
    }

    .services-list li {
      font-size: clamp(1.15rem, 3.6vw, 1.65rem);
      font-weight: 500;
      letter-spacing: -0.025em;
      color: var(--text);
      line-height: 1.25;
      text-align: center;
      transition: color 0.2s ease, transform 0.2s var(--ease);
      user-select: none;
      padding: 2px 8px;
    }

    .services-list li:hover {
      color: var(--accent);
      transform: scale(1.02);
    }

    /* Loop back link */
    .link-back:hover .arrow {
      transform: translateY(-4px);
    }

    .key-hint {
      position: fixed;
      bottom: 18px;
      right: 24px;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 6px;
      user-select: none;
      pointer-events: none;
      opacity: 0.7;
    }

    .key-hint kbd {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-subtle);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.68rem;
    }

    @media (max-width: 600px) {
      .key-hint { display: none; }
      .brand-title { letter-spacing: -0.025em; }
    }
  </style>
</head>
<body>

  <!-- Top Utility Bar -->
  <header class="top-bar">
    <!-- Official Camp Digital CD Flag (Page 16 of Carly's Deck) -->
    <a href="#home" class="flag-icon-btn" id="flagBtn" aria-label="Camp Digital Home">
      <svg viewBox="0 0 74 56" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M 71.58 44.94 L 1.80 55.03 C 0.85 55.17 0.00 54.43 0.00 53.48 L 0.00 1.69 C 0.00 0.74 0.85 0.00 1.80 0.14 L 71.21 10.18 C 72.59 10.38 73.04 12.14 71.94 12.99 L 56.09 25.09 C 55.31 25.69 55.27 26.85 56.00 27.51 L 72.40 42.21 C 73.40 43.10 72.90 44.74 71.58 44.94 Z" fill="#1a1c22" stroke="rgba(255,255,255,0.22)" stroke-width="1.4" stroke-linejoin="round"/>
        <path d="M 26.8 23.4 C 25.5 20.8 23.0 19.3 19.8 19.3 C 14.7 19.3 10.9 23.2 10.9 28.5 C 10.9 33.8 14.7 37.7 19.8 37.7 C 23.0 37.7 25.5 36.2 26.8 33.6 L 23.0 32.0 C 22.2 33.4 20.9 34.1 19.7 34.1 C 16.8 34.1 14.8 31.8 14.8 28.5 C 14.8 25.2 16.8 22.9 19.7 22.9 C 20.9 22.9 22.2 23.6 23.0 25.0 Z" fill="#f5f6f8"/>
        <path d="M 41.5 13.0 H 37.8 V 20.4 C 36.4 19.5 34.7 19.1 32.7 19.1 C 27.6 19.1 23.8 23.0 23.8 28.5 C 23.8 34.0 27.6 37.9 32.7 37.9 C 34.7 37.9 36.4 37.5 37.8 36.6 V 37.5 H 41.5 Z M 32.7 34.3 C 29.8 34.3 27.7 31.9 27.7 28.5 C 27.7 25.1 29.8 22.7 32.7 22.7 C 35.6 22.7 37.8 25.1 37.8 28.5 C 37.8 31.9 35.6 34.3 32.7 34.3 Z" fill="#f5f6f8"/>
      </svg>
    </a>

    <!-- Top Right: TL;DR vs Full Site Toggle + Perpetual Mail Icon -->
    <div class="top-actions">
      <div class="view-toggle" role="group" aria-label="View format">
        <span class="view-toggle-item active">TL;DR</span>
        <a href="studio.html" class="view-toggle-item">Full Site</a>
      </div>

      <a href="mailto:hello@camp.digital" class="mail-icon-btn" aria-label="Email Camp Digital at hello@camp.digital">
        <svg viewBox="0 0 24 24">
          <rect x="2" y="4" width="20" height="16" rx="3.5"></rect>
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
        </svg>
      </a>
    </div>
  </header>

  <!-- Central Stage -->
  <main class="stage">
    <div class="slider-track">

      <!-- PAGE 1: HOME -->
      <section class="page-panel active" id="pageHome" aria-label="Camp Digital Intro">
        <h1 class="brand-title">camp digital</h1>
        <p class="brand-tagline">the social team for brands</p>

        <div class="nav-stack">
          <!-- Portfolio Link (points to Instagram) -->
          <a href="https://www.instagram.com/camp_digital/" target="_blank" rel="noopener noreferrer" class="action-link link-portfolio" id="linkPortfolio">
            <span>portfolio</span>
            <span class="arrow">&rarr;</span>
          </a>

          <!-- Offerings Link (navigates down to offerings) -->
          <button type="button" class="action-link link-offerings" id="btnGoOfferings" aria-controls="pageOfferings">
            <span>offerings</span>
            <span class="arrow">&darr;</span>
          </button>
        </div>
      </section>

      <!-- PAGE 2: OFFERINGS -->
      <section class="page-panel" id="pageOfferings" aria-label="Camp Digital Offerings">
        <h2 class="offerings-heading">hire us for:</h2>

        <ul class="services-list">
          <li>content creation and production</li>
          <li>full-service social media management</li>
          <li>influencer marketing and UGC programming</li>
          <li>paid ads, SEO/AEO</li>
        </ul>

        <!-- Loop back to Home Link -->
        <button type="button" class="action-link link-back" id="btnGoHome" aria-controls="pageHome">
          <span class="arrow">&uarr;</span>
          <span>home</span>
        </button>
      </section>

    </div>
  </main>


  <!-- Key hint for navigation -->
  <div class="key-hint">
    <span>navigate</span>
    <kbd>&darr;</kbd>
    <kbd>&uarr;</kbd>
  </div>

  <script>
    (function () {
      const pageHome = document.getElementById('pageHome');
      const pageOfferings = document.getElementById('pageOfferings');
      const btnGoOfferings = document.getElementById('btnGoOfferings');
      const btnGoHome = document.getElementById('btnGoHome');
      const flagBtn = document.getElementById('flagBtn');

      let currentPage = 'home';

      function showPage(page, direction = 'down') {
        if (page === currentPage) return;

        if (page === 'offerings') {
          pageHome.classList.remove('active');
          pageHome.classList.add('exiting-up');
          pageOfferings.classList.add('active');
          pageOfferings.classList.remove('exiting-up');
          currentPage = 'offerings';
          window.location.hash = 'offerings';
        } else {
          pageOfferings.classList.remove('active');
          pageOfferings.classList.remove('exiting-up');
          pageHome.classList.add('active');
          pageHome.classList.remove('exiting-up');
          currentPage = 'home';
          window.location.hash = 'home';
        }
      }

      btnGoOfferings.addEventListener('click', () => showPage('offerings', 'down'));
      btnGoHome.addEventListener('click', () => showPage('home', 'up'));
      flagBtn.addEventListener('click', (e) => {
        e.preventDefault();
        showPage('home', 'up');
      });

      function syncHash() {
        if (window.location.hash === '#offerings') {
          showPage('offerings', 'down');
        } else {
          showPage('home', 'up');
        }
      }

      window.addEventListener('hashchange', syncHash);
      if (window.location.hash === '#offerings') {
        showPage('offerings', 'down');
      }

      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowDown' || e.key === 'PageDown') {
          e.preventDefault();
          showPage('offerings', 'down');
        } else if (e.key === 'ArrowUp' || e.key === 'PageUp' || e.key === 'Escape') {
          e.preventDefault();
          showPage('home', 'up');
        }
      });

      let scrollCooldown = false;
      window.addEventListener('wheel', (e) => {
        if (scrollCooldown) return;
        if (e.deltaY > 30 && currentPage === 'home') {
          scrollCooldown = true;
          showPage('offerings', 'down');
          setTimeout(() => { scrollCooldown = false; }, 600);
        } else if (e.deltaY < -30 && currentPage === 'offerings') {
          scrollCooldown = true;
          showPage('home', 'up');
          setTimeout(() => { scrollCooldown = false; }, 600);
        }
      }, { passive: true });
    })();
  </script>
</body>
</html>
